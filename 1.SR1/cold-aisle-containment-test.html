<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: Cold aisle containment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDF1F4; --sheet: #F7F9FA; --ink: #16232D; --muted: #52626E;
    --line: #9AA8B2; --faint: #C9D3DA;
    --cold: #2471B3; --cold-wash: rgba(36,113,179,.11);
    --hot: #C8372B; --hot-wash: rgba(200,55,43,.09);
    --struct: #1E6F66; --struct-wash: rgba(30,111,102,.10);
    --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0F161B; --sheet: #152028; --ink: #DCE5EA; --muted: #95A5B0;
      --line: #4A5B67; --faint: #2A3943;
      --cold: #5AA6E8; --cold-wash: rgba(90,166,232,.14);
      --hot: #F06A5C; --hot-wash: rgba(240,106,92,.12);
      --struct: #4FB8A8; --struct-wash: rgba(79,184,168,.13);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.05rem; line-height: 1.55; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); }

  header { padding: clamp(36px, 6vw, 72px) 0 20px; }
  h1 { font-family: var(--display); font-stretch: 68%; font-weight: 800; font-size: clamp(2.4rem, 7vw, 4.4rem); line-height: .92; margin: 0 0 14px; }
  .intro { color: var(--muted); max-width: 58ch; margin: 0 0 20px; }

  /* Title block doubles as the candidate/score panel */
  .titleblock {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1.5px solid var(--ink); background: var(--sheet); font-family: var(--display);
  }
  .titleblock div { padding: 8px 12px; border-left: 1px solid var(--line); }
  .titleblock div:first-child { border-left: 0; }
  .titleblock small { display: block; font-size: .72rem; color: var(--muted); }
  .titleblock strong { font-size: 1.05rem; font-weight: 700; }

  .bar { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 10px 0; border-bottom: 1px solid var(--faint); }
  .progress { height: 6px; border: 1px solid var(--ink); background: var(--sheet); }
  .progress span { display: block; height: 100%; width: 0; background: var(--cold); transition: width .2s; }
  .bar p { margin: 6px 0 0; font-family: var(--display); font-size: .85rem; color: var(--muted); }

  ol.qs { list-style: none; padding: 0; margin: 24px 0 0; counter-reset: q; }
  .q {
    counter-increment: q; background: var(--sheet); border: 1.5px solid var(--ink);
    margin: 0 0 18px; position: relative;
  }
  .q-head { display: grid; grid-template-columns: 58px 1fr; border-bottom: 1px solid var(--line); }
  .q-head::before {
    content: counter(q);
    font-family: var(--display); font-stretch: 70%; font-weight: 800; font-size: 1.7rem;
    display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--line);
  }
  .q-head .stem { padding: 12px 16px; }
  .q-head .kind { display: block; font-family: var(--display); font-size: .74rem; color: var(--muted); margin-bottom: 2px; }
  .q-head .text { font-weight: 600; }
  .fig { padding: 12px 16px 0; }
  .fig svg { display: block; width: 100%; max-width: 560px; height: auto; }
  fieldset { border: 0; margin: 0; padding: 10px 12px 12px; }
  legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .opt {
    display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px;
    padding: 9px 10px; border: 1px solid transparent; cursor: pointer;
  }
  .opt:hover { border-color: var(--line); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .key {
    width: 26px; height: 26px; border: 1.5px solid var(--ink); border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: .8rem; font-weight: 700;
  }
  .opt input:checked + .key { background: var(--ink); color: var(--sheet); }
  .opt input:focus-visible + .key { outline: 3px solid var(--cold); outline-offset: 2px; }
  .opt .mark { font-family: var(--display); font-size: .8rem; font-weight: 700; }

  .graded .opt { cursor: default; }
  .graded .opt:hover { border-color: transparent; }
  .opt.correct { background: var(--struct-wash); border-color: var(--struct); }
  .opt.correct .mark { color: var(--struct); }
  .opt.wrong { background: var(--hot-wash); border-color: var(--hot); }
  .opt.wrong .mark { color: var(--hot); }
  .explain { display: none; margin: 0 12px 12px; padding: 10px 14px; border-left: 3px solid var(--struct); font-size: .97rem; }
  .graded .explain { display: block; }
  .q.missed .explain { border-left-color: var(--hot); }
  .explain b { font-family: var(--display); }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 24px 0 56px; }
  button {
    font-family: var(--display); font-weight: 650; font-size: 1rem;
    padding: 12px 20px; border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--ink); color: var(--sheet); }
  button:focus-visible { outline: 3px solid var(--cold); outline-offset: 2px; }
  button[disabled] { opacity: .45; cursor: not-allowed; }

  .result { display: none; margin: 8px 0 20px; border: 1.5px solid var(--ink); background: var(--sheet); }
  .result.show { display: grid; grid-template-columns: auto 1fr; }
  .result .score {
    font-family: var(--display); font-stretch: 68%; font-weight: 800; font-size: 3.4rem; line-height: 1;
    padding: 16px 22px; border-right: 1px solid var(--line); display: flex; align-items: center;
  }
  .result .verdict { padding: 14px 18px; }
  .result .verdict strong { font-family: var(--display); font-size: 1.2rem; display: block; margin-bottom: 4px; }
  .result .verdict p { margin: 0; color: var(--muted); }

  /* svg */
  .ink { stroke: var(--ink); fill: none; } .thin { stroke: var(--line); fill: none; }
  .rack { fill: var(--sheet); stroke: var(--ink); stroke-width: 2; }
  .lbl { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--ink); }
  .lbl-s { font-family: var(--display); font-size: 11px; fill: var(--muted); }
  .f-cold { fill: var(--cold); } .f-hot { fill: var(--hot); }
  .hatch-fill { fill: url(#hatch); }

  @media (max-width: 600px) {
    .titleblock { grid-template-columns: 1fr 1fr; }
    .titleblock div:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
    .titleblock div:nth-child(4) { border-top: 1px solid var(--line); }
    .q-head { grid-template-columns: 44px 1fr; }
    .result.show { grid-template-columns: 1fr; }
    .result .score { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" style="stroke:var(--line);stroke-width:1.2"/>
    </pattern>
  </defs>
</svg>

<header class="wrap">
  <h1>Test: cold aisle containment</h1>
  <p class="intro">Twenty objective questions on data center cooling and aisle containment. Choose one answer per question, then submit to see your score and an explanation for each item.</p>
  <div class="titleblock" aria-live="polite">
    <div><small>Questions</small><strong id="tb-total">20</strong></div>
    <div><small>Answered</small><strong id="tb-answered">0</strong></div>
    <div><small>Score</small><strong id="tb-score">–</strong></div>
    <div><small>Pass mark</small><strong>70%</strong></div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="progress" aria-hidden="true"><span id="prog"></span></div>
    <p id="prog-text">0 of 20 answered</p>
  </div>
</div>

<main class="wrap">
  <div class="result" id="result" tabindex="-1">
    <div class="score" id="result-score"></div>
    <div class="verdict"><strong id="result-title"></strong><p id="result-text"></p></div>
  </div>

  <form id="test" novalidate>
    <ol class="qs" id="qs"></ol>
    <div class="actions">
      <button type="submit" class="primary" id="submit">Submit answers</button>
      <button type="button" id="retry" hidden>Retake test</button>
      <button type="button" id="shuffle">Shuffle questions</button>
    </div>
  </form>
</main>

<script>
const FIG_AISLES = `
<svg viewBox="0 0 560 210" role="img" aria-label="Section with three aisles lettered A, B and C, separated by two rack rows whose fronts are marked in blue">
  <line x1="0" y1="20" x2="560" y2="20" class="ink" style="stroke-width:2"/>
  <line x1="0" y1="170" x2="560" y2="170" class="ink" style="stroke-width:3"/>
  <rect x="0" y="170" width="560" height="18" class="hatch-fill"/>
  <rect x="170" y="60" width="60" height="110" class="rack"/>
  <rect x="330" y="60" width="60" height="110" class="rack"/>
  <rect x="226" y="60" width="6" height="110" class="f-cold"/>
  <rect x="328" y="60" width="6" height="110" class="f-cold"/>
  <g class="thin"><line x1="174" y1="85" x2="226" y2="85"/><line x1="174" y1="110" x2="226" y2="110"/><line x1="174" y1="135" x2="226" y2="135"/>
  <line x1="334" y1="85" x2="386" y2="85"/><line x1="334" y1="110" x2="386" y2="110"/><line x1="334" y1="135" x2="386" y2="135"/></g>
  <circle cx="90" cy="115" r="18" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1.5"/><text x="90" y="120" text-anchor="middle" class="lbl">A</text>
  <circle cx="280" cy="115" r="18" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1.5"/><text x="280" y="120" text-anchor="middle" class="lbl">B</text>
  <circle cx="470" cy="115" r="18" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1.5"/><text x="470" y="120" text-anchor="middle" class="lbl">C</text>
  <text x="280" y="204" text-anchor="middle" class="lbl-s">Blue edge = rack front (air intake). Not to scale.</text>
</svg>`;

const FIG_RACK = `
<svg viewBox="0 0 560 200" role="img" aria-label="Rack elevation with one empty slot highlighted by a hatched panel labelled X">
  <rect x="200" y="20" width="160" height="160" class="rack"/>
  <g class="thin">
    <line x1="206" y1="40" x2="354" y2="40"/><line x1="206" y1="60" x2="354" y2="60"/>
    <line x1="206" y1="120" x2="354" y2="120"/><line x1="206" y1="140" x2="354" y2="140"/><line x1="206" y1="160" x2="354" y2="160"/>
  </g>
  <rect x="203" y="62" width="154" height="56" class="hatch-fill" style="stroke:var(--ink);stroke-width:1.5"/>
  <line x1="357" y1="90" x2="420" y2="90" class="ink"/>
  <circle cx="436" cy="90" r="16" style="fill:var(--sheet);stroke:var(--ink);stroke-width:1.5"/><text x="436" y="95" text-anchor="middle" class="lbl">X</text>
  <text x="280" y="196" text-anchor="middle" class="lbl-s">Rack viewed from the front. Not to scale.</text>
</svg>`;

const QUESTIONS = [
  { kind: "Multiple choice", q: "According to the 2007 Pacific Gas and Electric study reported by Gartner, aisle containment can reduce cool-air operating costs by about:",
    opts: ["10%", "20%", "50%", "75%"], a: 1,
    why: "The PG&E study (2007), reported by Gartner, put the saving at 20%." },
  { kind: "Multiple choice", q: "Lawrence Berkeley National Laboratory (2007) found that cold aisle containment could cut the electricity used to move cold supply air by:",
    opts: ["30%", "45%", "75%", "90%"], a: 2,
    why: "LBNL found fan energy for moving supply air could fall by 75%." },
  { kind: "Multiple choice", q: "Cold aisle containment has the potential to reduce cooling-related energy costs by up to:",
    opts: ["30%", "15%", "60%", "5%"], a: 0,
    why: "The article cites a potential reduction of up to 30%." },
  { kind: "Multiple choice", q: "In a conventional raised-floor data center, where are CRAC units typically located?",
    opts: ["Inside the cold aisle", "On top of each rack", "Around the perimeter, outside the rack rows", "Beneath the raised floor, under each rack"], a: 2,
    why: "CRAC units usually sit around the room perimeter and blow cold air into the underfloor plenum." },
  { kind: "Multiple choice", q: "In conventional cooling, cold air from the CRAC units reaches the racks mainly through:",
    opts: ["Overhead ducts above the hot aisle", "A plenum under the raised floor", "Wall-mounted diffusers", "Ducts inside each rack"], a: 1,
    why: "Cold air travels through the raised-floor plenum and rises through perforated tiles." },
  { kind: "Multiple choice", q: "In an uncontained hot aisle/cold aisle layout, where does hot and cold air most often mix?",
    opts: ["At the bottom of the racks", "Inside the CRAC units", "In the underfloor plenum", "Near the tops of racks and at the ends of cold aisles"], a: 3,
    why: "Exhaust spills over rack tops and wraps around row ends, raising intake temperatures there." },
  { kind: "Multiple choice", q: "Why is increasing airflow into the cold aisles a less efficient fix for hot spots?",
    opts: ["It raises energy use", "It lowers the supply temperature below ASHRAE limits", "It damages perforated tiles", "It increases humidity"], a: 0,
    why: "More airflow can mask the imbalance, but it costs more fan energy." },
  { kind: "Figure", fig: FIG_AISLES, q: "In the section above, which letter marks the cold aisle?",
    opts: ["A", "B", "C", "Both A and C"], a: 1,
    why: "Both rack fronts (intakes) face aisle B, so B is the cold aisle. A and C receive exhaust from the rack backs and are hot aisles." },
  { kind: "Multiple choice", q: "The heat load produced by computer servers is best described as:",
    opts: ["Mostly latent", "Half sensible, half latent", "100% sensible, with no moisture content", "100% latent"], a: 2,
    why: "Server heat adds no moisture; it is entirely sensible heat." },
  { kind: "Multiple choice", q: "What is the main purpose of a good vapor barrier and sealed doors and windows in a data center?",
    opts: ["To keep dust out of the servers", "To minimize the latent (moisture-related) cooling load", "To increase air pressure in the hot aisle", "To meet fire code"], a: 1,
    why: "Keeping moisture out means cooling capacity goes to the servers' sensible heat instead of dehumidifying." },
  { kind: "Multiple choice", q: "Arranging racks in a hot aisle/cold aisle configuration helps the CRAC units because it:",
    opts: ["Lowers the temperature of the return air", "Removes the need for a raised floor", "Reduces the number of CRAC units required", "Raises the temperature of the air returning to the CRAC"], a: 3,
    why: "Warmer return air lets the CRAC unit operate more efficiently." },
  { kind: "Figure", fig: FIG_RACK, q: "Component X, fitted in an empty rack slot, is a:",
    opts: ["Blanking panel", "Perforated tile", "Cable manager", "Containment door"], a: 0,
    why: "Blanking panels fill empty slots so hot exhaust cannot circulate back to the front of the rack." },
  { kind: "Multiple choice", q: "Where should CRAC units ideally be positioned relative to the aisles?",
    opts: ["At the end of cold aisles", "In the middle of each cold aisle", "At the end of hot aisles", "Directly above the racks"], a: 2,
    why: "At the end of hot aisles they shorten air travel and avoid dragging hot air through the cold aisles. An overhead return plenum is the alternative." },
  { kind: "Multiple choice", q: "If cables must remain under the raised floor, they should be placed:",
    opts: ["In the cold aisle, across it", "In the hot aisle, running parallel to it", "Directly under the perforated tiles", "Anywhere, as long as they are bundled"], a: 1,
    why: "Placing them in the hot aisle, parallel to it, keeps them out of the cold supply path." },
  { kind: "Multiple choice", q: "Which method does the article recommend for finding the best locations for perforated tiles?",
    opts: ["Trial and error with handheld thermometers", "Placing one tile in front of every rack", "Following the CRAC manufacturer's default layout", "A thermal assessment using computational fluid dynamics (CFD)"], a: 3,
    why: "A CFD thermal assessment models airflow to show where tiles should go." },
  { kind: "Multiple choice", q: "What is the ASHRAE recommended range for supply air temperature?",
    opts: ["18 °C to 27 °C (64.4 °F to 80.6 °F)", "10 °C to 18 °C (50 °F to 64.4 °F)", "22 °C to 32 °C (71.6 °F to 89.6 °F)", "15 °C to 20 °C (59 °F to 68 °F)"], a: 0,
    why: "ASHRAE recommends 18–27 °C. Raising supply temperature within this band cuts cooling energy." },
  { kind: "Multiple choice", q: "A full cold aisle containment system is typically built using:",
    opts: ["Plastic curtains only", "Extra perforated tiles and higher fan speeds", "Ceiling panels above the aisle and doors at the aisle ends", "In-row coolers between every rack"], a: 2,
    why: "Solid ceiling panels between adjoining racks plus end doors seal the aisle most completely." },
  { kind: "Multiple choice", q: "In the pressurized aisle approach, what cools the air?",
    opts: ["Perimeter CRAC units only", "Cooling modules above or on top of the racks", "Chilled plastic curtains", "Evaporative coolers under the floor"], a: 1,
    why: "Modules above or on the racks take hot-aisle air, cool it and supply it into the cold aisle, with doors closing the aisle ends." },
  { kind: "True or false", q: "Plastic curtains used for aisle containment must be fire code approved.",
    opts: ["True", "False"], a: 0,
    why: "True. Curtains must meet fire code before they can be installed." },
  { kind: "True or false", q: "Plastic curtains separate hot and cold air as efficiently as solid panels and doors.",
    opts: ["True", "False"], a: 1,
    why: "False. Curtains do separate the air streams, but they are less efficient than solid panels and doors." }
];

const qsEl = document.getElementById('qs');
const form = document.getElementById('test');
const submitBtn = document.getElementById('submit');
const retryBtn = document.getElementById('retry');
const shuffleBtn = document.getElementById('shuffle');
let order = QUESTIONS.map((_, i) => i);
let graded = false;

function render() {
  qsEl.innerHTML = '';
  order.forEach((qi, pos) => {
    const d = QUESTIONS[qi];
    const li = document.createElement('li');
    li.className = 'q';
    li.dataset.qi = qi;
    const letters = 'ABCD';
    li.innerHTML = `
      <div class="q-head"><div class="stem"><span class="kind">${d.kind}</span><span class="text" id="qt${qi}">${d.q}</span></div></div>
      ${d.fig ? `<div class="fig">${d.fig}</div>` : ''}
      <fieldset aria-labelledby="qt${qi}">
        <legend>Question ${pos + 1}</legend>
        ${d.opts.map((o, oi) => `
          <label class="opt" data-oi="${oi}">
            <input type="radio" name="q${qi}" value="${oi}">
            <span class="key">${d.opts.length === 2 ? (oi === 0 ? 'T' : 'F') : letters[oi]}</span>
            <span>${o}</span>
            <span class="mark"></span>
          </label>`).join('')}
      </fieldset>
      <div class="explain"></div>`;
    qsEl.appendChild(li);
  });
  updateProgress();
}

function answeredCount() {
  return QUESTIONS.filter((_, i) => form.querySelector(`input[name="q${i}"]:checked`)).length;
}

function updateProgress() {
  const n = answeredCount(), t = QUESTIONS.length;
  document.getElementById('prog').style.width = (n / t * 100) + '%';
  document.getElementById('prog-text').textContent = graded ? `Graded. ${n} of ${t} answered.` : `${n} of ${t} answered`;
  document.getElementById('tb-answered').textContent = n;
}

form.addEventListener('change', () => { if (!graded) updateProgress(); });

form.addEventListener('submit', e => {
  e.preventDefault();
  if (graded) return;
  const n = answeredCount();
  if (n < QUESTIONS.length && !confirm(`You've answered ${n} of ${QUESTIONS.length}. Unanswered questions count as wrong. Submit anyway?`)) return;
  graded = true;
  let score = 0;
  qsEl.querySelectorAll('.q').forEach(li => {
    const qi = +li.dataset.qi, d = QUESTIONS[qi];
    const chosen = form.querySelector(`input[name="q${qi}"]:checked`);
    const cv = chosen ? +chosen.value : -1;
    li.querySelectorAll('.opt').forEach(opt => {
      const oi = +opt.dataset.oi;
      opt.querySelector('input').disabled = true;
      if (oi === d.a) { opt.classList.add('correct'); opt.querySelector('.mark').textContent = 'Correct answer'; }
      if (oi === cv && cv !== d.a) { opt.classList.add('wrong'); opt.querySelector('.mark').textContent = 'Your answer'; }
    });
    const right = cv === d.a;
    if (right) score++; else li.classList.add('missed');
    li.querySelector('.explain').innerHTML = `<b>${right ? 'Correct.' : (cv === -1 ? 'Not answered.' : 'Incorrect.')}</b> ${d.why}`;
  });
  form.classList.add('graded');
  const t = QUESTIONS.length, pct = Math.round(score / t * 100);
  document.getElementById('tb-score').textContent = `${score} / ${t}`;
  document.getElementById('result-score').textContent = pct + '%';
  document.getElementById('result-title').textContent = pct >= 70 ? 'Pass' : 'Below pass mark';
  document.getElementById('result-text').textContent = pct >= 70
    ? `You scored ${score} of ${t}. Review the explanations below for any you missed.`
    : `You scored ${score} of ${t}. The pass mark is 70% (14 of 20). Review the explanations below, then retake the test.`;
  const res = document.getElementById('result');
  res.classList.add('show');
  submitBtn.disabled = true; shuffleBtn.disabled = true; retryBtn.hidden = false;
  updateProgress();
  res.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  res.focus({ preventScroll: true });
});

function reset() {
  graded = false;
  form.classList.remove('graded');
  document.getElementById('result').classList.remove('show');
  document.getElementById('tb-score').textContent = '–';
  submitBtn.disabled = false; shuffleBtn.disabled = false; retryBtn.hidden = true;
  render();
  window.scrollTo({ top: 0 });
}

retryBtn.addEventListener('click', reset);
shuffleBtn.addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  render();
});

render();
</script>
<script src="../nav.js" defer></script>
</body>
</html>
